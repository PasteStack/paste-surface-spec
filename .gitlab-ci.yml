include:
  - project: 'tomshley/brands/global/tware/tech/products/provisioning/cicd-pipelines'
    ref: 'v0.9.1'
    file: '/adapters/gitlab/ci/adapter.yml'

variables:
  CICD_PIPELINES_RUNNER_TAG: "0.9.1"
  BASE_CONTAINERS_REGISTRY: registry.gitlab.com/tomshley/brands/global/tware/tech/products/provisioning/base-containers
  BASE_CONTAINERS_UPSTREAM_TAG: "0.6.0"

# Branch and tag pipelines carry the build; merge request pipelines would only
# duplicate them (the adapter's workflow admits both), so they are skipped here.
# Tag pipelines must keep these jobs: the publish job declares `needs` on them.
.runs-on-branch-or-tag:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

validate-spec:
  extends: [.runs-on-branch-or-tag]
  image: alpine:3.21.3
  stage: test
  script:
    - test -s README.md
    - test -s VERSION
    - test -d spec
    - 'for feature in features/*.feature; do grep -q "^Feature:" "$feature" || { echo "no Feature: in $feature" >&2; exit 1; }; done'
    - test -s features/components.feature

package-spec:
  extends: [.runs-on-branch-or-tag]
  image: alpine:3.21.3
  stage: build
  script:
    - mkdir -p target
    - tar -czf "target/paste-surface-spec-${CI_COMMIT_SHA}.tar.gz" spec features README.md LICENSE NOTICE.md VERSION
  artifacts:
    paths: [target/paste-surface-spec-*.tar.gz]
    expire_in: 1 day

publish:
  extends: [.tomshley-cicd-publish-generic]
  needs: [package-spec, validate-spec]
  variables:
    TOMSHLEY_CICD_GENERIC_PACKAGE: paste-surface-spec
    TOMSHLEY_CICD_GENERIC_ARTIFACT: target/paste-surface-spec-${CI_COMMIT_SHA}.tar.gz
